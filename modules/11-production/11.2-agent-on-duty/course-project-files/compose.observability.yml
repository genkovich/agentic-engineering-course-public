services:
  app:
    labels:
      observability.logs: "true"

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3001:3000"

  loki:
    image: grafana/loki:3.7.3
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  alloy:
    image: grafana/alloy:v1.17.1
    restart: unless-stopped
    user: "0:0"
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    ports:
      - "127.0.0.1:12345:12345"

  alertmanager:
    image: prom/alertmanager:v0.33.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    secrets:
      - watcher_token
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    depends_on:
      - watcher
    ports:
      - "127.0.0.1:9093:9093"

  watcher:
    build:
      context: .
      dockerfile: observability/watcher/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      CLAUDE_MODEL: ${CLAUDE_MODEL:-sonnet}
      WATCHER_TOKEN_FILE: /run/secrets/watcher_token
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets:
      - watcher_token
      - anthropic_api_key
    volumes:
      - watcher-artifacts:/watcher/runtime/artifacts
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3002:3001"

secrets:
  watcher_token:
    file: ${WATCHER_TOKEN_FILE:-./observability/secrets/watcher-token.example.txt}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./observability/secrets/grafana-admin-password.example.txt}
  anthropic_api_key:
    file: ${ANTHROPIC_API_KEY_FILE:-./observability/secrets/anthropic-api-key.example.txt}

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:
  watcher-artifacts:
