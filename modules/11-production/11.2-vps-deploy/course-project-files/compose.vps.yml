name: course-project

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      DB_PATH: /app/data/data.db
      RELEASE_SHA: ${RELEASE_SHA:-local}
    ports:
      - "${APP_PORT:-80}:3000"
    volumes:
      - course-project-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  course-project-data:
    name: course-project-data
