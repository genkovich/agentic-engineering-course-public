name: Claude

# Дві ролі в одному workflow:
#   (a) claude       — mention-режим: @claude у issue/PR-коментарі діє.
#   (b) claude-review — авто-рев'ю кожного PR (prompt: /code-review).
# Секрет CLAUDE_CODE_OAUTH_TOKEN додається через /install-github-app
# (або вручну в Settings → Secrets). ANTHROPIC_API_KEY — альтернатива.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]

jobs:
  # (a) @claude mention — діє лише коли в тілі є тригер "@claude".
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # (b) Авто-рев'ю PR через слеш-команду /code-review.
  claude-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/code-review"
          # claude_args передає прапорці CLI у прохід рев'ю.
          claude_args: "--max-turns 15"
