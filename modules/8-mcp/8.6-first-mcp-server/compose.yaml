# Локальна перевірка образу перед деплоєм (лекція 8.12):
#   docker compose up --build
#   curl localhost:3335/healthz   → {"ok":true,"tasks":N}
# Зупинити і прибрати: docker compose down
services:
  task-store:
    build: .
    ports:
      - "3335:3335"
    # .env не обов'язковий: єдина змінна - PORT, у сервера є дефолт 3335
    env_file:
      - path: .env
        required: false
    volumes:
      - task-data:/app/data

volumes:
  task-data:
