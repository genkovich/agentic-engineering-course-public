openapi: 3.1.0
info:
  title: BeerLMS course-lesson-mvp API
  version: 1.1.0
  description: |
    External REST contract for the course-lesson-mvp feature (BeerLMS).
    Stage 10 (api-contracts) artifact generated by `api-forge` (sdlc plugin
    v3.3.0).

    ## Changelog

    - **v1.1.0** (this run): expanded from the original `lessons`-only slice
      to the **full PRD scope** (PRD §4 — 10 user stories). Adds the
      `courses` aggregate (US-01 / US-03 / US-04 / US-05), lesson
      `completion` (US-06), `user_preferences` + GDPR-friendly defaults
      (US-07), `peer_completion` signal on `GET /lessons/{id}` (US-08),
      `comments` (US-09) and `comments/hide` moderation (US-10). Marks
      `POST /lessons` as `deprecated: true` — superseded by
      `POST /courses/{course_id}/lessons`; lessons are now created under
      their parent course path (PRD US-02). Additive bump — no breaking
      changes to existing lesson-slice consumers.
    - **v1.0.0** (initial): `lessons` aggregate only (5 endpoints) — courses,
      completions, comments, user_preferences existed in `data-model.md` but
      their endpoints were intentionally deferred. This v1.1.0 closes that
      gap. `lessons.duration_seconds` was added between v1.0.0 baseline and
      the lecture 6.6 drift demo — re-surfaced here under `Lesson`.

    ## Sources of truth read by the skill

    - `docs/features/course-lesson-mvp/PRD.md` (§4 user stories, §5 ACs,
      §6.1 abuse cases for error mapping).
    - `docs/features/course-lesson-mvp/data-model.md` — single source of
      typed shape for **all 4 aggregate roots** + 8 child / audit tables.
    - `docs/features/course-lesson-mvp/sad.md` §6 — container-level
      sequences for US-01..US-10 + endpoint-level sequence for `POST
      /lessons/{id}/publish`.
    - `docs/features/course-lesson-mvp/adr/0001-content-storage-strategy.md`
      (polymorphic block payload per `block_type`).

    ## Companion artefacts

    `api-sync-report.md` next to this file — records field origins and
    runs the 5-point drift check inline (`api-forge` protocol step 17).
    `events.md` — async outbox events (`lesson.created`, `lesson.published`,
    `course.published`). Only those three events are documented because
    they are the only INSERT-into-outbox calls visible in §6 sequences;
    `comment.*` and `lesson.completed` have no outbox path in v1.

    ## Conventions

    All paths are nested under `/api/v1/` (URL versioning). Authentication
    is `BearerAuth` globally; no path declares `security: []`. Error
    response codes follow `<module>.<error_name>` snake_case (mentorship
    convention). Cursor pagination uses UUID v7 monotonic ordering
    (`?after=<uuid>&limit=<n>`).
  contact:
    name: BeerLMS Backend (example case study)
    url: https://github.com/genkovich/agentic-engineering-course

servers:
  - url: https://api.example.com/api/v1
    description: Production (placeholder)
  - url: http://localhost:8080/api/v1
    description: Local dev

security:
  - BearerAuth: []

tags:
  - name: courses
    description: Methodist-owned course aggregates — create, list, get, publish, reorder lessons.
  - name: lessons
    description: Course lessons — create, list, get, append content blocks, publish, complete.
  - name: comments
    description: Lesson-scoped member discussions — flat list, no threading in v1.
  - name: me
    description: Caller-scoped settings (preferences, GDPR opt-in).
  - name: moderation
    description: Admin-only moderation actions across the feature (US-10).

paths:
  /courses:
    post:
      summary: Create a new course (draft state)
      description: |
        Creates a `courses` row in the caller's org with `status='draft'`,
        `course_owner_id = caller.user_id`, `org_id = OrgCtx.OrgID` (PRD
        AC-01). Only `org_members` rows with `is_methodist = true` may
        create — non-methodist → 403 `course.not_methodist` (PRD AC-09 +
        US-01 sequence guard).

        Rate-limited at 30 req/min/user (PRD §6.1 abuse case 4); excess
        → 429 `rate_limited`.
      operationId: createCourse
      tags: [courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
            example:
              title: "Intro to Agentic Engineering"
              description: "8-week async course on agent-driven dev workflows."
              cover_image_url: "https://cdn.example.com/courses/agent-eng.png"
      responses:
        '201':
          description: Course created in draft state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
              example:
                id: "0195a9c1-aaaa-7000-9eb2-0123456789ab"
                course_owner_id: "0195a9c0-bbbb-7000-9eb2-0123456789ab"
                title: "Intro to Agentic Engineering"
                description: "8-week async course on agent-driven dev workflows."
                cover_image_url: "https://cdn.example.com/courses/agent-eng.png"
                status: "draft"
                published_at: null
                created_at: "2026-05-24T18:00:00Z"
                updated_at: "2026-05-24T18:00:00Z"
        '400':
          $ref: '#/components/responses/DescriptionTooLong'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CourseNotMethodist'
        '429':
          $ref: '#/components/responses/RateLimited'

    get:
      summary: List courses (cursor pagination)
      description: |
        Returns courses within the caller's org. `published` courses are
        visible to all org members; `draft` courses appear only when caller
        is the `course_owner` or an `admin` (PRD AC-08). Cursor pagination
        on UUID v7 (`?after=<id>&limit=<n>`); server fetches `limit + 1`
        to detect `has_next`.
      operationId: listCourses
      tags: [courses]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Course list page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /courses/{id}:
    get:
      summary: Get a specific course
      description: |
        Single-course view. Cross-org reads on a `published` course →
        **404** `course.not_found` (PRD AC-07 — existence-hiding deviation
        from mentorship-style 403). Same-org `draft` course where caller
        is neither `course_owner` nor `admin` → 404 (PRD AC-08).
      operationId: getCourse
      tags: [courses]
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      responses:
        '200':
          description: Course details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CourseNotFound'

  /courses/{id}/lessons:
    post:
      summary: Create a lesson inside a course (US-02 primary route)
      description: |
        Creates a lesson under `course_id` (path) for the authenticated
        methodist who owns the parent course (PRD US-02). Sequence is
        assigned to the next free integer within the course unless
        explicitly provided. Concurrent inserts with the same
        `(course_id, sequence)` resolve via DB UNIQUE constraint → 409
        `lesson.sequence_conflict` (PRD AC-04 + AC-04b — no app-level lock).

        Cross-org parent (caller's org ≠ `course.org_id`) → 404
        `course.not_found` (PRD AC-10 — repo filters
        `WHERE course.org_id = $1` before attach).

        This is the **preferred route** introduced in v1.1.0; the legacy
        top-level `POST /lessons` (which takes `course_id` in the body)
        is `deprecated`.
      operationId: createCourseLesson
      tags: [lessons]
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseLessonRequest'
            example:
              title: "Intro to prompt engineering"
              sequence: 1
              duration_seconds: 720
      responses:
        '201':
          description: Lesson created in draft state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CourseNotFound'
        '409':
          $ref: '#/components/responses/SequenceConflict'

  /courses/{id}/publish:
    post:
      summary: Transition course draft → published
      description: |
        Idempotent: republish on `status='published'` returns 200 without
        changing `published_at` (PRD AC-06 mirror — same semantics as
        lesson publish). Pre-condition: ≥1 published lesson exists in the
        course; otherwise 409 `course.no_published_lessons` (PRD AC-05).
        Only the `course_owner` may publish; non-owner / wrong-org → 404
        `course.not_found` (US-03 sequence guard collapses both into a
        single existence-hiding response).

        The transaction enqueues `course.published` into the outbox in
        the same commit as the UPDATE (US-03 sequence:
        `BEGIN; UPDATE; INSERT outbox; COMMIT`). `Idempotency-Key` is
        therefore mandatory — the outbox poller treats the event as
        retry-safe and the API must deduplicate retries within a 24h
        window.
      operationId: publishCourse
      tags: [courses]
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Course published (also returned on idempotent re-publish).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CourseNotFound'
        '409':
          $ref: '#/components/responses/NoPublishedLessons'

  /courses/{id}/lessons/reorder:
    patch:
      summary: Reorder lessons within a draft course
      description: |
        Bulk update of lesson sequences (PRD US-05). Allowed only on
        `course.status='draft'` (US-05 sequence guard) — reorder on a
        published course → 409 `course.already_published`. Payload bounded
        at `len(items) ≤ 50` to prevent reorder-DoS (PRD §6.1 abuse case
        5); excess → 400 `validation.reorder_payload_too_large`. Atomic:
        the batch UPDATE runs inside a single transaction; any
        `(course_id, sequence)` UNIQUE violation rolls back the whole
        change.
      operationId: reorderCourseLessons
      tags: [courses]
      parameters:
        - $ref: '#/components/parameters/CourseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderLessonsRequest'
            example:
              items:
                - lesson_id: "0195a9c0-d2b8-7000-9eb2-1234567890ab"
                  sequence: 2
                - lesson_id: "0195a9c0-d2b8-7000-9eb2-1234567890cd"
                  sequence: 1
      responses:
        '200':
          description: New ordering accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReorderLessonsResponse'
        '400':
          $ref: '#/components/responses/ReorderPayloadTooLarge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CourseNotFound'
        '409':
          $ref: '#/components/responses/CourseAlreadyPublished'

  /lessons:
    post:
      summary: "[DEPRECATED] Create a new lesson (use POST /courses/{id}/lessons instead)"
      deprecated: true
      description: |
        **Deprecated in v1.1.0.** Superseded by
        `POST /courses/{course_id}/lessons` which nests the lesson under
        its parent course path (PRD US-02 canonical route). This endpoint
        is kept for backward-compat with v1.0.0 clients: it accepts
        `course_id` in the request body and behaves identically. Will be
        removed in a future major bump with a migration window.

        Creates a lesson inside `course_id` for the authenticated methodist.
        Sequence is assigned to the next free integer within the course
        unless explicitly provided. Concurrent inserts with the same
        `(course_id, sequence)` resolve via DB UNIQUE constraint → 409
        `lesson.sequence_conflict` (per PRD AC-04b — no app-level lock).
      operationId: createLesson
      tags: [lessons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLessonRequest'
            example:
              course_id: "01956b3a-4f0d-7321-8b3a-4f0d73218b3a"
              title: "Intro to prompt engineering"
              sequence: 1
      responses:
        '201':
          description: Lesson created in draft state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
              example:
                id: "0195a9c0-d2b8-7000-9eb2-1234567890ab"
                course_id: "01956b3a-4f0d-7321-8b3a-4f0d73218b3a"
                sequence: 1
                title: "Intro to prompt engineering"
                status: "draft"
                published_at: null
                created_at: "2026-05-24T18:00:00Z"
                updated_at: "2026-05-24T18:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CourseNotFound'
        '409':
          $ref: '#/components/responses/SequenceConflict'

    get:
      summary: List lessons (cursor pagination)
      description: |
        Returns lessons within the caller's org. Cursor pagination on
        UUID v7 (`?after=<id>&limit=<n>`); server fetches `limit + 1`
        to detect `has_next`.
      operationId: listLessons
      tags: [lessons]
      parameters:
        - $ref: '#/components/parameters/CourseIdQuery'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lesson list page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonListResponse'
              example:
                items:
                  - id: "0195a9c0-d2b8-7000-9eb2-1234567890ab"
                    course_id: "01956b3a-4f0d-7321-8b3a-4f0d73218b3a"
                    sequence: 1
                    title: "Intro to prompt engineering"
                    status: "draft"
                    published_at: null
                    created_at: "2026-05-24T18:00:00Z"
                    updated_at: "2026-05-24T18:00:00Z"
                has_next: false
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lessons/{id}:
    get:
      summary: Get a specific lesson (with optional peer-completion signal)
      description: |
        Returns lesson with all `lesson_blocks` ordered by `sequence ASC`.
        Cross-org reads on a published lesson → 404 per PRD §6.1 abuse-case 1
        (existence-hiding).

        **v1.1.0 addition** — the response now includes the optional
        `peer_completion` field (PRD US-08 + AC-14 / AC-15): count of
        completions within the caller's org plus up to 5 recent completers
        whose `user_preferences.peer_visibility='public'`, and a boolean
        `my_completed` for the caller. If `count < 3`, AC-15 anti-fingerprinting
        guard fires — `count` returns `null` and `recent_completers` is
        empty (still honest about `my_completed`).
      operationId: getLesson
      tags: [lessons]
      parameters:
        - $ref: '#/components/parameters/LessonIdPath'
      responses:
        '200':
          description: Lesson with blocks (and peer-completion signal on published lessons).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonWithBlocks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /lessons/{id}/blocks:
    post:
      summary: Append a content block to lesson
      description: |
        Appends a `lesson_blocks` row. `block_type` is one of the four
        DDL-enforced values (`text`, `video_embed`, `image`, `code`).
        `payload` shape is polymorphic per `block_type` — see ADR-0001
        and the schema description for the expected keys per type.
      operationId: addBlock
      tags: [lessons]
      parameters:
        - $ref: '#/components/parameters/LessonIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBlockRequest'
            example:
              block_type: "text"
              payload:
                content: "Welcome to the lesson."
      responses:
        '201':
          description: Block appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonBlock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BlockSequenceConflict'

  /lessons/{id}/publish:
    post:
      summary: Transition lesson draft → published
      description: |
        Idempotent: republish on `status='published'` returns 200 without
        changing `published_at`. Only the methodist owning the parent course
        (`courses.course_owner_id`) may publish; cross-methodist → 403
        `lesson.forbidden` (per `seq-publish-lesson.md` alt-branch).

        The transaction enqueues `lesson.published` into the outbox in the
        same commit as the UPDATE (sequence diagram: `BEGIN; UPDATE; INSERT
        outbox; COMMIT`). `Idempotency-Key` is therefore mandatory — the
        outbox poller treats the event as retry-safe and the API must
        deduplicate retries within a 24h window.
      operationId: publishLesson
      tags: [lessons]
      parameters:
        - $ref: '#/components/parameters/LessonIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Lesson published (also returned on idempotent re-publish).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lessons/{id}/completion:
    post:
      summary: Mark lesson as completed by the caller (idempotent)
      description: |
        Inserts a `lesson_completions` row for `(user_id=caller,
        lesson_id=path)` with `org_id` denormalized from the lesson's
        parent course (PRD AC-11). Allowed only on `published` lessons of
        the caller's org — anything else → 404 `lesson.not_found` (PRD
        AC-12; covers draft / cross-org with existence-hiding).

        **Idempotency model** — guaranteed by the `UNIQUE(user_id,
        lesson_id)` constraint (data-model.md). First POST returns
        **201** with the new `completed_at`; subsequent POSTs return
        **200** with the existing `completed_at` unchanged. The handler
        re-reads on `pq.unique_violation` (US-06 sequence) — no
        `Idempotency-Key` header is required.
      operationId: completeLesson
      tags: [lessons]
      parameters:
        - $ref: '#/components/parameters/LessonIdPath'
      responses:
        '201':
          description: First completion recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonCompletion'
        '200':
          description: Idempotent re-completion — returns the existing row unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonCompletion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /lessons/{id}/comments:
    post:
      summary: Post a comment on a published lesson
      description: |
        Plain-text comment (PRD US-09 — flat list, no threading in v1).
        Allowed only on `published` lessons of the caller's org — draft
        or cross-org → 404 `lesson.not_found`. `content` is server-side
        HTML-escaped before persist (XSS mitigation, §6.1 abuse case 7).

        Length cap: ≤2000 chars (PRD AC-17); over → 400
        `validation.comment_too_long`. Rate-limited at 10
        comments/hour/user (§6.1 abuse case 8); over → 429 `rate_limited`.
      operationId: createComment
      tags: [comments]
      parameters:
        - $ref: '#/components/parameters/LessonIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
            example:
              content: "How does the publish gate handle empty courses?"
      responses:
        '201':
          description: Comment posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/CommentTooLong'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

    get:
      summary: List comments for a lesson (cursor pagination)
      description: |
        Returns visible comments for `lesson_id` ordered by
        `created_at DESC` (most recent first). Hidden comments
        (`status='hidden'`) are returned with their placeholder content
        (`"[hidden by moderator]"`) so the FE can render moderation
        breadcrumbs without losing context. Default `limit=20`, max 100.
      operationId: listLessonComments
      tags: [comments]
      parameters:
        - $ref: '#/components/parameters/LessonIdPath'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Comment list page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /comments/{id}/hide:
    post:
      summary: Hide a comment (admin moderation, US-10)
      description: |
        Soft-hides the comment: `status` flips to `'hidden'`, `content`
        is replaced with the placeholder `"[hidden by moderator]"`, and
        the original content is preserved in `comment_audit` for
        compliance recall (PRD AC-18). Allowed only when
        `OrgMemberChecker.IsAdmin(org_id, caller) = true`; non-admin →
        **403** `comment.not_moderator`. Cross-org comment / unknown id
        → 404 `comment.not_found`.
      operationId: hideComment
      tags: [moderation]
      parameters:
        - $ref: '#/components/parameters/CommentIdPath'
      responses:
        '200':
          description: Comment hidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CommentNotModerator'
        '404':
          $ref: '#/components/responses/CommentNotFound'

  /me/preferences:
    get:
      summary: Get the caller's user preferences
      description: |
        Returns the caller's `user_preferences` singleton. For first-time
        users (no row exists yet) the server returns the GDPR-friendly
        default — `peer_visibility: "private"` with `updated_at` set to
        the response time. The actual row is created lazily on the first
        PATCH.
      operationId: getMyPreferences
      tags: [me]
      responses:
        '200':
          description: Preferences for the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      summary: Update the caller's user preferences (GDPR audited)
      description: |
        Upserts the caller's `user_preferences` row. The handler writes
        both the UPSERT and a `user_preference_audit` entry in a single
        transaction (US-07 sequence) — `{user_id, field, old_value,
        new_value, changed_at}` — for GDPR compliance recall.

        Default `peer_visibility` for a new user is `private` (PRD AC-13
        — privacy-by-default). Invalid enum value → 400
        `validation.invalid_preference`.
      operationId: updateMyPreferences
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesRequest'
            example:
              peer_visibility: "public"
      responses:
        '200':
          description: Preferences updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          $ref: '#/components/responses/InvalidPreference'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    LessonIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Lesson UUID v7.

    CourseIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Course UUID v7.

    CommentIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Comment UUID v7.

    CourseIdQuery:
      name: course_id
      in: query
      schema:
        type: string
        format: uuid
      description: |
        Optional. If provided, only lessons of this course are returned.

    CursorParam:
      name: after
      in: query
      schema:
        type: string
        format: uuid
      description: |
        UUID v7 of the last item from the previous page. Omit for the first page.

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: |
        Client-generated UUID. Server deduplicates retries within a 24h
        window. Required on publish endpoints because the publish
        transaction enqueues an outbox event consumed by media-worker /
        notification-service.

  schemas:
    # -------- existing lessons slice --------

    Lesson:
      type: object
      required: [id, course_id, sequence, title, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: "0195a9c0-d2b8-7000-9eb2-1234567890ab"
        course_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
          description: |
            Integer ordering within the parent course; UNIQUE per course
            via `(course_id, sequence)`.
        title:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [draft, published]
        duration_seconds:
          type: [integer, "null"]
          minimum: 300
          maximum: 14400
          description: |
            Optional estimated duration in seconds (5 min — 4 h). FE shows
            this as a "≈ N min" badge before opening the lesson. Origin:
            `lessons.duration_seconds INT NULL CHECK (BETWEEN 300 AND 14400)`.
        published_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LessonWithBlocks:
      allOf:
        - $ref: '#/components/schemas/Lesson'
        - type: object
          required: [blocks]
          properties:
            blocks:
              type: array
              items:
                $ref: '#/components/schemas/LessonBlock'
              description: Ordered by `sequence ASC`.
            peer_completion:
              $ref: '#/components/schemas/PeerCompletionSignal'

    LessonBlock:
      type: object
      required: [id, lesson_id, sequence, block_type, payload, created_at]
      properties:
        id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        block_type:
          type: string
          enum: [text, video_embed, image, code]
          description: |
            DDL-enforced via `CHECK IN ('text','video_embed','image','code')`
            on `lesson_blocks.block_type`.
        payload:
          type: object
          description: |
            Polymorphic payload per `block_type` (ADR-0001):
              text         → {content: string}
              video_embed  → {url: string, provider: string}
              image        → {url: string, alt: string}
              code         → {language: string, content: string}
            `additionalProperties: true` is a deliberate exception to the
            api-forge default — see api-sync-report.md "Polymorphic exception"
            note for justification. Tightening to per-type variants requires
            JSON Schema 2020-12 conditional schemas; deferred to follow-up.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateLessonRequest:
      type: object
      required: [course_id, title]
      properties:
        course_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        sequence:
          type: integer
          minimum: 1
          description: |
            Optional. If omitted, server assigns the next free integer for
            the course. If provided and already taken → 409 `lesson.sequence_conflict`.
        duration_seconds:
          type: integer
          minimum: 300
          maximum: 14400
          description: |
            Optional estimated duration in seconds (5 min — 4 h). If omitted,
            stored as NULL and FE skips the duration badge.

    CreateCourseLessonRequest:
      type: object
      required: [title]
      description: |
        Body for `POST /courses/{id}/lessons` — `course_id` comes from the
        path, so it is not duplicated in the body (US-02 canonical route).
      properties:
        title:
          type: string
          maxLength: 200
        sequence:
          type: integer
          minimum: 1
          description: Optional. Defaults to next free integer for the course.
        duration_seconds:
          type: integer
          minimum: 300
          maximum: 14400
          description: Optional estimated duration in seconds (5 min — 4 h).

    AddBlockRequest:
      type: object
      required: [block_type, payload]
      properties:
        block_type:
          type: string
          enum: [text, video_embed, image, code]
        sequence:
          type: integer
          minimum: 1
          description: |
            Optional. Defaults to next free integer within the lesson.
        payload:
          type: object
          additionalProperties: true

    LessonListResponse:
      type: object
      required: [items, has_next]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
        has_next:
          type: boolean
          description: |
            true if there are more items after this page. Server fetches
            `limit + 1` to detect.
        next_cursor:
          type: [string, "null"]
          format: uuid
          description: |
            Use as `after` for the next page. Null if `has_next: false`.

    # -------- courses aggregate (v1.1) --------

    Course:
      type: object
      required: [id, course_owner_id, title, status, created_at, updated_at]
      description: |
        Public-facing course shape. `org_id` is intentionally omitted from
        the response — it is the multi-tenant boundary and exposing it
        would surface internal scope to clients.
      properties:
        id:
          type: string
          format: uuid
        course_owner_id:
          type: string
          format: uuid
          description: References `users.id`; mirrors `courses.course_owner_id`.
        title:
          type: string
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 500
          description: |
            Plain text, ≤500 chars (PRD AC-02). DDL: `VARCHAR(500) NULL`.
        cover_image_url:
          type: [string, "null"]
          description: |
            Optional. URL string only — server does NOT fetch the URL in
            v1 (PRD §6.1 SSRF mitigation). Allowlist of provider hosts is
            tracked in OQ-1 / OQ-2.
        status:
          type: string
          enum: [draft, published]
        published_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCourseRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 500
          description: |
            Optional. Plain text ≤500 chars; over → 400
            `validation.description_too_long` (PRD AC-02).
        cover_image_url:
          type: string
          description: |
            Optional. URL string. Strict URL validation (scheme, host
            allowlist) is deferred per PRD OQ-1 / OQ-2 — for now treated
            as opaque string at this layer; sanitisation runs in the
            handler.

    CourseListResponse:
      type: object
      required: [items, has_next]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        has_next:
          type: boolean
        next_cursor:
          type: [string, "null"]
          format: uuid

    ReorderLessonsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: |
            Bounded at 50 entries (PRD §6.1 abuse case 5 — reorder DoS
            mitigation). Each entry assigns a new `sequence` to a lesson
            owned by the course.
          items:
            $ref: '#/components/schemas/ReorderLessonsItem'

    ReorderLessonsItem:
      type: object
      required: [lesson_id, sequence]
      properties:
        lesson_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1

    ReorderLessonsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReorderLessonsItem'

    # -------- completions (v1.1) --------

    LessonCompletion:
      type: object
      required: [id, user_id, lesson_id, completed_at, created_at]
      description: |
        Single completion event. `org_id` is intentionally hidden from
        the response — it is denormalized internally for peer-blob
        aggregation but exposing it would leak tenant scope to the client.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
        completed_at:
          type: string
          format: date-time
          description: |
            Set on first INSERT; unchanged on idempotent re-POST
            (UNIQUE(user_id, lesson_id) prevents overwrite).
        created_at:
          type: string
          format: date-time

    # -------- user preferences (v1.1) --------

    UserPreferences:
      type: object
      required: [peer_visibility, updated_at]
      description: |
        Caller-scoped settings. `user_id` is omitted — it is implicitly
        the caller, deriving it from the JWT.
      properties:
        peer_visibility:
          type: string
          enum: [public, private]
          description: |
            DDL-enforced via `user_preferences.peer_visibility VARCHAR(20)
            NOT NULL DEFAULT 'private' CHECK IN ('public','private')`.
        updated_at:
          type: string
          format: date-time

    UpdateUserPreferencesRequest:
      type: object
      required: [peer_visibility]
      properties:
        peer_visibility:
          type: string
          enum: [public, private]

    # -------- peer-completion signal (v1.1) --------

    PeerCompletionSignal:
      type: object
      required: [count, recent_completers, my_completed]
      description: |
        Aggregated peer signal for a lesson within the caller's org (PRD
        US-08). NOT backed by a single DDL column — derived from a JOIN
        of `lesson_completions` × `user_preferences` constrained to
        public-visibility users (AC-14), with the anti-fingerprinting
        guard from AC-15 (`count < 3 → count:null, recent_completers:[]`).
      properties:
        count:
          type: [integer, "null"]
          minimum: 0
          description: |
            Total completions for this lesson in the caller's org.
            `null` when AC-15 anti-fingerprinting guard fires
            (`count < 3`).
        recent_completers:
          type: array
          maxItems: 5
          description: |
            Up to 5 most-recent completers whose `peer_visibility='public'`.
            Empty array when the AC-15 guard fires OR when no public
            completers exist.
          items:
            $ref: '#/components/schemas/PeerCompleter'
        my_completed:
          type: boolean
          description: |
            True if the caller has a `lesson_completions` row for this
            lesson. Honest regardless of `count` — the caller's own
            completion never falls under anti-fingerprinting.

    PeerCompleter:
      type: object
      required: [user_id, display_name]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          description: |
            User-facing display name. Source: `users.display_name`
            (existing column outside this feature's data-model.md).

    # -------- comments (v1.1) --------

    Comment:
      type: object
      required: [id, lesson_id, author_id, content, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        content:
          type: string
          description: |
            Plain-text content (≤2000 chars, app-validated). On hidden
            comments returns the placeholder `"[hidden by moderator]"` —
            the original is preserved in `comment_audit` (PRD AC-18).
        status:
          type: string
          enum: [visible, hidden]
          description: |
            DDL: `comments.status VARCHAR(20) NOT NULL DEFAULT 'visible'
            CHECK IN ('visible','hidden')`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 2000
          description: |
            Plain text ≤2000 chars (PRD AC-17). Over → 400
            `validation.comment_too_long`. Server HTML-escapes before
            persist (§6.1 abuse case 7).

    CommentListResponse:
      type: object
      required: [items, has_next]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        has_next:
          type: boolean
        next_cursor:
          type: [string, "null"]
          format: uuid

    # -------- shared error envelope --------

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "<module>.<error_name> snake_case"
          example: "lesson.not_found"
        message:
          type: string
          description: Human-readable message for end users.
        details:
          type: object
          additionalProperties: true
          description: Optional context (e.g. field-level validation errors).

  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "lesson.invalid_payload"
            message: "course_id is required"

    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "auth.unauthorized"
            message: "Bearer token missing or invalid"

    Forbidden:
      description: |
        JWT valid but caller lacks the right. Per `seq-publish-lesson.md`
        alt-branch "lesson not owned" — covers cross-methodist publish
        and non-methodist create.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "lesson.forbidden"
            message: "Only the course owner can publish this lesson"

    NotFound:
      description: |
        Lesson does not exist, or is in `status: draft` and caller is not
        the owner (PRD AC-08), or belongs to a different org (PRD AC-07
        existence-hiding deviation). Also covers `POST /lessons/{id}/completion`
        and `POST /lessons/{id}/comments` on draft / cross-org lessons
        (PRD AC-12).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "lesson.not_found"
            message: "Lesson does not exist or is not visible to caller"

    CourseNotFound:
      description: |
        Course does not exist in the caller's org, or is `draft` and
        caller is not the owner / admin (PRD AC-07 / AC-08 / AC-10 —
        existence-hiding across cross-org and draft-leak vectors).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "course.not_found"
            message: "Course does not exist or is not visible to caller"

    CourseNotMethodist:
      description: |
        Caller's `org_members.is_methodist` is `false` for the current
        org. PRD AC-09 — mirror of mentorship `not_mentor`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "course.not_methodist"
            message: "Only methodists can create courses"

    CourseAlreadyPublished:
      description: |
        Attempted to reorder lessons on a `published` course. PRD US-05 +
        US-05 sequence guard — reorder allowed only on drafts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "course.already_published"
            message: "Cannot reorder lessons in a published course"

    NoPublishedLessons:
      description: |
        Attempted to publish a course with 0 published lessons. PRD AC-05
        — invariant guarded in the app-layer before the UPDATE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "course.no_published_lessons"
            message: "Course must have at least one published lesson"

    DescriptionTooLong:
      description: |
        `description` exceeded 500 chars (PRD AC-02 + DDL
        `VARCHAR(500)`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "validation.description_too_long"
            message: "description must be at most 500 characters"

    CommentTooLong:
      description: |
        `content` exceeded 2000 chars (PRD AC-17 — handler-side validation,
        not VARCHAR(2000) because moderation replaces content with a
        placeholder).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "validation.comment_too_long"
            message: "comment must be at most 2000 characters"

    ReorderPayloadTooLarge:
      description: |
        `items` array exceeded 50 entries (PRD §6.1 abuse case 5 — DoS
        mitigation).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "validation.reorder_payload_too_large"
            message: "reorder payload must have at most 50 items"

    InvalidPreference:
      description: |
        Unknown enum value for a preference field. Currently only
        `peer_visibility` exists (PRD AC-13 + DDL CHECK IN
        ('public','private')).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "validation.invalid_preference"
            message: "peer_visibility must be one of: public, private"

    CommentNotFound:
      description: |
        Comment does not exist or belongs to a different org's lesson
        (US-10 sequence — existence-hiding consistent with AC-07).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "comment.not_found"
            message: "Comment does not exist or is not visible to caller"

    CommentNotModerator:
      description: |
        Caller is not an admin in the org owning the comment. PRD AC-18 +
        US-10 sequence guard.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "comment.not_moderator"
            message: "Only admins can hide comments"

    RateLimited:
      description: |
        Per-user rate-limit exceeded. Applies to:
          - `POST /courses` — 30 req/min/user (PRD §6.1 abuse case 4)
          - `POST /lessons/{id}/comments` — 10 comments/h/user (PRD §6.1 abuse case 8)
        Both share the `rate_limited` code; specific quota details live
        in PRD §6.1 — no `X-RateLimit-*` headers are defined in v1.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "rate_limited"
            message: "Too many requests"

    SequenceConflict:
      description: |
        `(course_id, sequence)` UNIQUE constraint violated. Origin:
        `data-model.md` → `lessons` table `UNIQUE (course_id, sequence)`.
        Two concurrent POSTs with the same explicit `sequence` → one wins,
        the other gets this 409 (per PRD AC-04b).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "lesson.sequence_conflict"
            message: "Lesson with this sequence already exists in the course"

    BlockSequenceConflict:
      description: |
        `(lesson_id, sequence)` UNIQUE constraint violated on `lesson_blocks`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "lesson.block_sequence_conflict"
            message: "Block with this sequence already exists in the lesson"
