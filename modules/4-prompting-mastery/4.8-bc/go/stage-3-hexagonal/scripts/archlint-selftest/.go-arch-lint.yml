version: 3
workdir: .

allow:
  deepScan: false

components:
  a:
    in: a
  b:
    in: b

deps:
  # `a` може тягнути лише сторонні бібліотеки, на інші компоненти проєкту
  # права не має. У a/a.go імпорт `b` стоїть НАВМИСНЕ — саме його лінтер
  # зобов'язаний знайти.
  #
  # Порожній `mayDependOn: []` тут не підходить: go-arch-lint (щонайменше
  # з v1.17) відкидає такий конфіг ще на валідації і теж повертає 1.
  # Ненульовий код тоді нічого не доводить, тому run.sh шукає саме рядок
  # порушення, а не лише код виходу.
  a:
    anyVendorDeps: true
  b:
    anyVendorDeps: true
