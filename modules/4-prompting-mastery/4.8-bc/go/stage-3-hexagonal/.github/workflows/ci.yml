# Ілюстрація для лекції: як арх-тест виглядає в CI.
#
# GitHub читає workflow-файли ТІЛЬКИ з `.github/workflows/` у корені репозиторію,
# тому цей файл тут не запускається — він лежить поруч із кодом як зразок,
# який ти копіюєш у свій проєкт (звідти й шляхи `modules/...`).
# Справжній прогін цього демо живе в кореневому `.github/workflows/4.8-bc.yml`.

name: CI (Go stage-3-hexagonal)

on:
  push:
    paths:
      - 'modules/4-prompting-mastery/4.8-bc/go/stage-3-hexagonal/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'modules/4-prompting-mastery/4.8-bc/go/stage-3-hexagonal/**'

defaults:
  run:
    working-directory: modules/4-prompting-mastery/4.8-bc/go/stage-3-hexagonal

jobs:
  build-and-arch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Версія береться з go.mod — один source of truth замість двох,
          # які розходяться.
          go-version-file: modules/4-prompting-mastery/4.8-bc/go/stage-3-hexagonal/go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Та сама обгортка, що й локально: вона відрізняє "лінтер знайшов
      # порушення" від "лінтер впав сам" і в обох випадках дає ненульовий код.
      - name: Arch test
        run: bash ./scripts/arch-test.sh

      # Негативний контроль: доводить, що лінтер узагалі здатний бачити порушення.
      - name: Arch lint self-test
        run: bash ./scripts/archlint-selftest/run.sh
