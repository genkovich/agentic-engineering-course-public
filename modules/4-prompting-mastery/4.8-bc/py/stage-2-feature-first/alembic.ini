[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Драйвер названий явно (+psycopg). Без нього SQLAlchemy вгадує
# psycopg2, якого немає в залежностях.
sqlalchemy.url = postgresql+psycopg://demo:demo@localhost:5432/demo

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
