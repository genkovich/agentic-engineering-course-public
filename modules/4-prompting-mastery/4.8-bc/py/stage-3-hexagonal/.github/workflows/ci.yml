name: CI (py stage-3)

on:
  push:
    paths:
      - '4.8-bc/py/stage-3-hexagonal/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '4.8-bc/py/stage-3-hexagonal/**'

defaults:
  run:
    working-directory: 4.8-bc/py/stage-3-hexagonal

jobs:
  build-and-arch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[arch]"

      - name: Compile check
        run: python -m compileall app

      - name: Arch test
        run: lint-imports --config importlinter.ini
