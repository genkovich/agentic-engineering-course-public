[importlinter]
root_packages =
    app

[importlinter:contract:independence]
name = BCs are independent
type = independence
modules =
    app.auth
    app.catalog
    app.commerce
    app.billing
    app.notifications
ignore_imports =
    app.notifications.infra.events.* -> app.auth.domain.*
    app.notifications.infra.events.* -> app.commerce.domain.*
    app.notifications.infra.events.* -> app.billing.domain.*

[importlinter:contract:layers-auth]
name = Auth layers
type = layers
layers =
    app.auth.infra
    app.auth.app
    app.auth.domain

[importlinter:contract:layers-catalog]
name = Catalog layers
type = layers
layers =
    app.catalog.infra
    app.catalog.app
    app.catalog.domain

[importlinter:contract:layers-commerce]
name = Commerce layers
type = layers
layers =
    app.commerce.infra
    app.commerce.app
    app.commerce.domain

[importlinter:contract:layers-billing]
name = Billing layers
type = layers
layers =
    app.billing.infra
    app.billing.app
    app.billing.domain

[importlinter:contract:layers-notifications]
name = Notifications layers
type = layers
layers =
    app.notifications.infra
    app.notifications.app
    app.notifications.domain
