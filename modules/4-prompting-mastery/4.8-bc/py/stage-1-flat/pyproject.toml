[project]
name = "stage-1-flat"
version = "0.1.0"
description = "Stage 1 (flat layered) — Bounded Contexts demo, Python edition"
# Верхня межа свідома: під новішим Python частина залежностей
# ще не має бінарних коліс.
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.110.0",
    # uvicorn БЕЗ [standard]: цей extra тягне uvloop, який не має коліс
    # під свіжий Python і ламає встановлення на рівному місці.
    "uvicorn>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    # asyncpg — для застосунку (async), psycopg 3 — для alembic (sync).
    # Синхронний драйвер названий явно: інакше SQLAlchemy вгадує psycopg2,
    # якого тут немає, і міграції падають з ModuleNotFoundError.
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.1",
    # [email] обов'язковий: DTO використовують pydantic.EmailStr, а вона
    # без email-validator падає при імпорті застосунку, а не при валідації.
    "pydantic[email]>=2.6.0",
    # bcrypt напряму, без passlib: passlib закинутий і чіпає стандартний
    # модуль crypt, якого в Python 3.13+ уже немає. Формат хеша ($2b$)
    # той самий, старі хеші лишаються валідними.
    "bcrypt>=4.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
