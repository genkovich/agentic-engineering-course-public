# Ілюстрація для лекції: як арх-тест виглядає в CI.
#
# GitHub читає workflow-файли ТІЛЬКИ з `.github/workflows/` у корені репозиторію,
# тому цей файл тут не запускається — він лежить поруч із кодом як зразок,
# який ти копіюєш у свій проєкт (звідти й шляхи `modules/...`).
# Справжній прогін цього демо живе в кореневому `.github/workflows/4.8-bc.yml`.

name: CI (TS stage-3-hexagonal)

on:
  push:
    paths:
      - 'modules/4-prompting-mastery/4.8-bc/ts/stage-3-hexagonal/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'modules/4-prompting-mastery/4.8-bc/ts/stage-3-hexagonal/**'

defaults:
  run:
    working-directory: modules/4-prompting-mastery/4.8-bc/ts/stage-3-hexagonal

jobs:
  build-and-arch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: modules/4-prompting-mastery/4.8-bc/ts/stage-3-hexagonal/.nvmrc
          cache: 'npm'
          cache-dependency-path: modules/4-prompting-mastery/4.8-bc/ts/stage-3-hexagonal/package-lock.json

      # Строго `npm ci`, без фолбеку на `npm install`: саме такий фолбек
      # дозволяв відсутньому lockfile роками лишатися непоміченим.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Arch test
        run: ./node_modules/.bin/depcruise --config .dependency-cruiser.cjs src
