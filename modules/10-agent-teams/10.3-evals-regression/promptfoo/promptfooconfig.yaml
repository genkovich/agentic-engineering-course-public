# 10.3 · Основний Promptfoo-сьют: агент лагодить роут, асерти всіх трьох класів.
#
# Той самий принцип, що в python-харнесі поруч (tests/agent/): детермінований
# грейдер над недетермінованим агентом. Але індустріальним інструментом:
# декларативний YAML, матриця тестів, історія прогонів, веб-переглядач.
#
# Запуск (коштує токени, потрібен ANTHROPIC_API_KEY):
#   bash setup.sh                      # чиста робоча копія fixtures/route -> workdir/
#   npx promptfoo@latest eval --no-cache
#   npx promptfoo@latest view          # веб-переглядач результатів
#
# Другий конфіг цього пакета - review/promptfooconfig.yaml: кастомний провайдер
# provider.py жене read-only агента ro-reviewer через той самий двигун харнесу.

description: '10.3 · агент додає auth на роут: детерміновані + python + trajectory асерти'

prompts:
  - file://prompts/fix-route.md

# Trajectory-асерти читають trace агента - без цього блока вони падають
# з «No trace data available». Promptfoo піднімає локальний OTLP-приймач,
# а env-блок провайдера каже Claude Agent SDK слати телеметрію туди.
tracing:
  enabled: true
  otlp:
    http:
      enabled: true
      port: 4318

providers:
  # «Coding agent SDK»-провайдер: реальний coding-агент через Claude Agent SDK.
  # Потребує npm-пакет поруч із конфігом: npm install @anthropic-ai/claude-agent-sdk
  # working_dir - пісочниця прогону; acceptEdits, НЕ bypassPermissions -
  # інакше deny-правила і хуки конфігурації не діяли б (та сама гоча, що в харнесі).
  # apiKeyRequired: false - авторизація через локальну сесію Claude Code
  # (Pro/Max підписка) замість ANTHROPIC_API_KEY.
  - id: anthropic:claude-agent-sdk
    config:
      model: claude-sonnet-5
      working_dir: ./workdir
      append_allowed_tools: ['Write', 'Edit', 'MultiEdit', 'Bash']
      permission_mode: acceptEdits
      apiKeyRequired: false
      env:
        CLAUDE_CODE_ENABLE_TELEMETRY: '1'
        OTEL_EXPORTER_OTLP_ENDPOINT: 'http://127.0.0.1:4318'
        OTEL_EXPORTER_OTLP_PROTOCOL: 'http/protobuf'

# Спільні асерти кожного тесту сьюту: бюджет кроків і стеля вартості.
defaultTest:
  assert:
    # Бюджет кроків: захист від нескінченного блукання (і від «0 кроків»).
    # type: tool - так claude-agent-sdk маркує кроки у trace (tool:Bash,
    # tool:Read, ...); тип `command` - з trace-схеми Codex SDK, тут дав би 0.
    - type: trajectory:step-count
      value:
        type: tool
        min: 1
        max: 30
    # Cost-стеля на один прогін - страховка nightly-рахунку.
    - type: cost
      threshold: 0.75

tests:
  - description: '/private захищено, агент сам це довів, підсумок згадує 401'
    vars:
      format: 'одним коротким абзацом'
    assert:
      # Trajectory: агент СПРАВДІ виконував команди (піднімав сервіс, ганяв
      # curl), а не лише написав «готово».
      - type: trajectory:tool-used
        value: Bash
      # Детермінований шар по фінальному тексту.
      - type: contains
        value: '401'
      # Python-асерт = МІСТОК до власного харнесу: той самий грейдер
      # (живий сервіс + HTTP-коди), що в tests/agent/cases/route-auth/check.py.
      - type: python
        value: file://check_route.py

  - description: 'той самий контракт, підсумок машинно-читабельний (JSON)'
    vars:
      format: >-
        ТІЛЬКИ одним JSON-об'єктом без жодного іншого тексту:
        {"private_no_auth": <код>, "private_with_token": <код>, "public": <код>}
    assert:
      - type: is-json
      - type: javascript
        value: |
          const s = JSON.parse(output);
          return s.private_no_auth === 401 &&
                 s.private_with_token === 200 &&
                 s.public === 200;
      - type: python
        value: file://check_route.py
