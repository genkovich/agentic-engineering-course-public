[package]
name = "agentic-engineering-rust-axum-starter"
version = "0.1.0"
edition = "2021"
description = "Module 3 starter: Rust + axum + tokio з Claude Code production-ready конфігом"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
